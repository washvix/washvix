<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Washvix — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0a0d;
    --panel:#161319;
    --panel-2:#1d1a21;
    --blue:#0066ff;
    --cyan:#0d99ff;
    --chrome:#f4f2ef;
    --steel:#948f9b;
    --line: rgba(244,242,239,0.09);
    --grad: linear-gradient(120deg, var(--blue), var(--cyan) 55%, var(--blue));
    --danger: #ef4444;
    --success: #10b981;
    --warning: #f59e0b;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--ink);
    color:var(--chrome);
    font-family:'Lato',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  /* NAV */
  header{
    background:rgba(11,10,13,0.9);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:100;
  }
  .nav-inner{
    max-width:1200px; margin:0 auto; padding:16px 28px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:36px;height:36px;}
  .brand-name{font-size:22px;letter-spacing:0.08em;color:var(--chrome);font-weight:700;}
  .brand-name .accent{color:var(--cyan);}
  .admin-badge{
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    background:rgba(13,153,255,0.15); border:1px solid rgba(13,153,255,0.4);
    color:var(--cyan); padding:4px 10px; border-radius:100px; font-weight:700;
  }
  .site-link{
    font-size:13px; color:var(--steel); transition:color 0.2s;
    display:flex; align-items:center; gap:6px;
  }
  .site-link:hover{color:var(--cyan);}

  .wrap{max-width:1200px; margin:0 auto; padding:32px 28px;}

  /* STATS CARDS */
  .stats-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
    gap:20px; margin-bottom:36px;
  }
  .stat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px; position:relative; overflow:hidden;
  }
  .stat-card::before{
    content:''; position:absolute; top:0; left:0; width:4px; height:100%;
    background:var(--grad);
  }
  .stat-label{font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--steel); margin-bottom:6px;}
  .stat-val{font-size:32px; font-weight:900; color:var(--chrome);}

  /* TABS BAR */
  .tabs-bar{
    display:flex; gap:12px; border-bottom:1px solid var(--line);
    margin-bottom:32px; padding-bottom:12px; flex-wrap:wrap;
  }
  .tab-btn{
    padding:12px 24px; border-radius:100px; border:1px solid var(--line);
    background:var(--panel); color:var(--steel); font-size:14px; font-weight:700;
    transition:all 0.25s ease; display:inline-flex; align-items:center; gap:8px;
  }
  .tab-btn:hover{color:var(--chrome); border-color:rgba(13,153,255,0.4);}
  .tab-btn.active{
    background:var(--grad); color:#fff; border-color:transparent;
    box-shadow:0 4px 18px rgba(13,153,255,0.35);
  }

  .tab-content{display:none;}
  .tab-content.active{display:block;}

  /* FILTERS & ACTION BAR */
  .action-bar{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:16px; margin-bottom:24px;
  }
  .filters-row{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  .input-field{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px 16px; color:var(--chrome); font-family:inherit; font-size:13px;
  }
  .input-field:focus{outline:none; border-color:var(--cyan);}

  .btn-danger{
    background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4);
    color:var(--danger); padding:10px 18px; border-radius:100px; font-size:13px;
    font-weight:700; transition:all 0.2s ease;
  }
  .btn-danger:hover{background:var(--danger); color:#fff;}

  /* CARDS & LISTS */
  .items-grid{
    display:grid; grid-template-columns:1fr; gap:18px;
  }

  .admin-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:24px; transition:border-color 0.2s ease;
  }
  .admin-card:hover{border-color:rgba(13,153,255,0.3);}

  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:16px; flex-wrap:wrap; margin-bottom:14px;
  }
  .person-title{font-size:18px; font-weight:700; color:var(--chrome);}
  .person-sub{font-size:13px; color:var(--steel); margin-top:2px;}

  .badge{
    font-size:11px; font-weight:700; padding:4px 10px; border-radius:100px;
    text-transform:uppercase; letter-spacing:0.06em;
  }
  .badge-pending{background:rgba(245,158,11,0.15); color:var(--warning); border:1px solid rgba(245,158,11,0.3);}
  .badge-confirmed{background:rgba(16,185,129,0.15); color:var(--success); border:1px solid rgba(16,185,129,0.3);}
  .badge-completed{background:rgba(13,153,255,0.15); color:var(--cyan); border:1px solid rgba(13,153,255,0.3);}

  .details-list{
    display:flex; gap:16px 24px; flex-wrap:wrap; font-size:13px;
    color:var(--steel); margin-bottom:16px; padding:12px 0;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .details-list span strong{color:var(--chrome); font-weight:600;}

  .comment-box{
    font-size:14px; line-height:1.6; color:var(--chrome);
    background:var(--ink); padding:14px 18px; border-radius:100px;
    border-radius:10px; margin-bottom:16px; border:1px solid var(--line);
  }

  .card-actions{
    display:flex; justify-content:flex-end; gap:12px; align-items:center;
  }
  .status-select{
    background:var(--ink); border:1px solid var(--line); border-radius:8px;
    padding:6px 12px; color:var(--chrome); font-size:12px; font-family:inherit;
  }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--steel);
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
  }
  .empty-state h3{font-size:20px; color:var(--chrome); margin-bottom:8px;}

  /* REVIEWS SPECIFIC */
  .review-stars{color:#ffb703; font-size:16px; letter-spacing:2px;}

  .login-panel{
    max-width:420px; margin:100px auto; padding:30px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px;
  }
  .login-panel h1{font-size:28px; margin-bottom:8px;}
  .login-panel p{color:var(--steel); margin-bottom:24px;}
  .login-panel label{display:block; font-size:13px; color:var(--steel); margin:16px 0 7px;}
  .login-panel input{width:100%; background:var(--ink); border:1px solid var(--line); border-radius:8px; padding:12px; color:var(--chrome); font:inherit;}
  .login-panel button{width:100%; margin-top:22px; background:var(--cyan); color:#fff; border-radius:8px; padding:12px; font-weight:700;}
  .login-error{color:var(--danger); min-height:20px; margin-top:14px; font-size:13px;}
  .logout-btn{color:var(--steel); font-size:13px; margin-left:18px;}
  .logout-btn:hover{color:var(--chrome);}
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 20 L42 80 L52 56" stroke="var(--chrome)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M34 18 L58 78 L80 18" stroke="var(--chrome)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M52 38 L72 82" stroke="var(--cyan)" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">WASH<span class="accent">VIX</span></span>
      <span class="admin-badge">ADMIN</span>
    </a>
    <div>
      <a href="index.html" class="site-link">← Live Main Website</a>
      <button class="logout-btn" id="logoutBtn" type="button" onclick="logoutAdmin()" hidden>Log out</button>
    </div>
  </div>
</header>

<section class="login-panel" id="loginPanel" hidden>
  <h1>Admin Login</h1>
  <p>Sign in to manage Washvix bookings and reviews.</p>
  <form id="loginForm">
    <label for="adminUsername">Username</label>
    <input id="adminUsername" name="username" autocomplete="username" required>
    <label for="adminPassword">Password</label>
    <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign In</button>
    <div class="login-error" id="loginError" role="alert"></div>
  </form>
</section>

<main class="wrap" id="adminContent" hidden>
  <!-- STATS OVERVIEW -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Bookings</div>
      <div class="stat-val" id="statBookings">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Reviews</div>
      <div class="stat-val" id="statReviews">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Average Customer Rating</div>
      <div class="stat-val" id="statRating">0.0 ★</div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs-bar">
    <button class="tab-btn active" id="tabBookingsBtn" onclick="switchTab('bookings')">
      📋 Bookings (<span id="countBookingsTab">0</span>)
    </button>
    <button class="tab-btn" id="tabReviewsBtn" onclick="switchTab('reviews')">
      ⭐ Customer Reviews (<span id="countReviewsTab">0</span>)
    </button>
  </div>

  <!-- BOOKINGS TAB -->
  <section class="tab-content active" id="tabBookings">
    <div class="action-bar">
      <div class="filters-row">
        <input type="date" id="filterDate" class="input-field" onchange="loadBookings()">
        <input type="text" id="filterPhone" class="input-field" placeholder="Search by name or phone..." oninput="loadBookings()">
      </div>
      <button class="btn-danger" onclick="clearAllBookings()">Clear All Bookings</button>
    </div>

    <div class="items-grid" id="bookingsList">
      <!-- Rendered dynamically -->
    </div>
  </section>

  <!-- REVIEWS TAB -->
  <section class="tab-content" id="tabReviews">
    <div class="action-bar">
      <div class="filters-row">
        <span style="font-size:14px; color:var(--steel);">Manage customer feedback & moderate reviews</span>
      </div>
      <button class="btn-danger" onclick="clearAllReviews()">Clear All Reviews</button>
    </div>

    <div class="items-grid" id="reviewsList">
      <!-- Rendered dynamically -->
    </div>
  </section>
</main>

<script src="api-integration.js"></script>
<script>
let currentTab = 'bookings';
const AUTH_API_BASE_URL = window.location.protocol === 'file:'
  ? 'http://localhost:5000/api'
  : `${window.location.origin}/api`;

async function checkAdminSession() {
  const response = await fetch(`${AUTH_API_BASE_URL}/auth/session`, { credentials: 'include' });
  const result = await response.json();
  document.getElementById('loginPanel').hidden = result.authenticated;
  document.getElementById('adminContent').hidden = !result.authenticated;
  document.getElementById('logoutBtn').hidden = !result.authenticated;
  if (result.authenticated) {
    loadBookings();
    loadReviews();
  }
}

document.getElementById('loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  const form = new FormData(event.currentTarget);
  const response = await fetch(`${AUTH_API_BASE_URL}/auth/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ username: form.get('username'), password: form.get('password') })
  });
  const result = await response.json();
  if (!result.success) {
    document.getElementById('loginError').textContent = result.error || 'Login failed';
    return;
  }
  event.currentTarget.reset();
  document.getElementById('loginError').textContent = '';
  checkAdminSession();
});

async function logoutAdmin() {
  await fetch(`${AUTH_API_BASE_URL}/auth/logout`, { method: 'POST', credentials: 'include' });
  checkAdminSession();
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabBookingsBtn').classList.toggle('active', tab === 'bookings');
  document.getElementById('tabReviewsBtn').classList.toggle('active', tab === 'reviews');
  document.getElementById('tabBookings').classList.toggle('active', tab === 'bookings');
  document.getElementById('tabReviews').classList.toggle('active', tab === 'reviews');

  if (tab === 'bookings') loadBookings();
  if (tab === 'reviews') loadReviews();
}

function getLocalStoredReviews() {
  try {
    const local = localStorage.getItem('washvix_custom_reviews');
    return local ? JSON.parse(local) : [];
  } catch(e) {
    return [];
  }
}

function setLocalStoredReviews(reviews) {
  try {
    localStorage.setItem('washvix_custom_reviews', JSON.stringify(reviews));
  } catch(e) {}
}

async function loadBookings() {
  let bookings = [];
  if (window.API && typeof window.API.fetchBookings === 'function') {
    bookings = await window.API.fetchBookings();
  } else {
    try {
      const local = localStorage.getItem('washvix_bookings');
      if (local) bookings = JSON.parse(local);
    } catch(e) {}
  }

  const dateFilter = document.getElementById('filterDate').value;
  const phoneFilter = document.getElementById('filterPhone').value.toLowerCase().trim();

  if (dateFilter) {
    bookings = bookings.filter(b => b.bookingDate === dateFilter);
  }
  if (phoneFilter) {
    bookings = bookings.filter(b => 
      (b.name && b.name.toLowerCase().includes(phoneFilter)) ||
      (b.phone && b.phone.toLowerCase().includes(phoneFilter))
    );
  }

  document.getElementById('statBookings').textContent = bookings.length;
  document.getElementById('countBookingsTab').textContent = bookings.length;

  const container = document.getElementById('bookingsList');
  if (bookings.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <h3>No Bookings Found</h3>
        <p>No customer bookings matching the current criteria.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = bookings.map(b => `
    <article class="admin-card">
      <div class="card-top">
        <div>
          <div class="person-title">${escapeHtml(b.name)}</div>
          <div class="person-sub">📞 ${escapeHtml(b.phone)} ${b.email ? '• ✉ ' + escapeHtml(b.email) : ''}</div>
        </div>
        <span class="badge badge-${(b.status || 'pending').toLowerCase()}">${escapeHtml(b.status || 'pending')}</span>
      </div>

      <div class="details-list">
        <span>📅 Date: <strong>${escapeHtml(b.bookingDate)}</strong></span>
        <span>⏰ Time: <strong>${escapeHtml(b.bookingTime)}</strong></span>
        <span>🚗 Vehicle: <strong>${escapeHtml(b.vehicleMake || 'N/A')} (${escapeHtml(b.vehicleSize || '')})</strong></span>
        <span>🧼 Services: <strong>${escapeHtml(b.services || 'General')}</strong></span>
        <span>💰 Price: <strong>${escapeHtml(b.price || 'N/A')}</strong></span>
        ${b.location ? `<span>📍 Location: <strong>${escapeHtml(b.location)}</strong></span>` : ''}
      </div>

      ${b.requests ? `<div class="comment-box"><strong>Special Notes:</strong> ${escapeHtml(b.requests)}</div>` : ''}

      <div class="card-actions">
        <label style="font-size:12px; color:var(--steel);">Status: </label>
        <select class="status-select" onchange="updateBookingStatus('${b.id}', this.value)">
          <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>Pending</option>
          <option value="confirmed" ${b.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
          <option value="completed" ${b.status === 'completed' ? 'selected' : ''}>Completed</option>
          <option value="cancelled" ${b.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
        </select>
        <button class="btn-danger" style="padding:6px 14px;" onclick="deleteBooking('${b.id}')">Delete</button>
      </div>
    </article>
  `).join('');
}

async function loadReviews() {
  let reviews = [];
  let apiReviews = [];

  if (window.API && typeof window.API.getReviews === 'function') {
    apiReviews = await window.API.getReviews();
  }

  const localReviews = getLocalStoredReviews();

  const combined = [...localReviews, ...apiReviews];
  const seen = new Set();
  reviews = combined.filter(r => {
    const id = r.id || r.created_at || r.name;
    if (seen.has(id)) return false;
    seen.add(id);
    return true;
  });

  document.getElementById('statReviews').textContent = reviews.length;
  document.getElementById('countReviewsTab').textContent = reviews.length;

  if (reviews.length > 0) {
    const avg = (reviews.reduce((acc, r) => acc + Number(r.rating || 5), 0) / reviews.length).toFixed(1);
    document.getElementById('statRating').textContent = `${avg} ★`;
  } else {
    document.getElementById('statRating').textContent = '0.0 ★';
  }

  const container = document.getElementById('reviewsList');
  if (reviews.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <h3>No Customer Reviews</h3>
        <p>No reviews have been submitted by customers yet.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = reviews.map(r => `
    <article class="admin-card">
      <div class="card-top">
        <div>
          <div class="person-title">${escapeHtml(r.name)} <span class="review-stars">${'★'.repeat(Number(r.rating || 5))}</span></div>
          <div class="person-sub">📍 ${escapeHtml(r.location || 'Rourkela')} ${r.vehicle ? '• 🚗 ' + escapeHtml(r.vehicle) : ''}</div>
        </div>
        <span class="badge badge-completed">${escapeHtml(r.service || 'Mobile Wash')}</span>
      </div>

      <div class="comment-box">"${escapeHtml(r.comment)}"</div>

      <div class="card-actions">
        <span style="font-size:12px; color:var(--steel); margin-right:auto;">Posted: ${escapeHtml(r.timestamp || r.created_at || 'Recently')}</span>
        <button class="btn-danger" style="padding:8px 16px;" onclick="deleteReview('${r.id}')">🗑 Delete Review</button>
      </div>
    </article>
  `).join('');
}

async function deleteReview(id) {
  if (!confirm('Are you sure you want to delete this customer review?')) return;

  if (window.API && typeof window.API.deleteReview === 'function') {
    await window.API.deleteReview(id);
  }

  const local = getLocalStoredReviews();
  const updated = local.filter(r => String(r.id) !== String(id));
  setLocalStoredReviews(updated);

  loadReviews();
}

async function clearAllReviews() {
  if (!confirm('WARNING: Are you sure you want to delete ALL customer reviews?')) return;

  if (window.API && typeof window.API.deleteAllReviews === 'function') {
    await window.API.deleteAllReviews();
  }

  setLocalStoredReviews([]);
  loadReviews();
}

async function updateBookingStatus(id, newStatus) {
  if (window.API && typeof window.API.updateStatus === 'function') {
    await window.API.updateStatus(id, newStatus);
  }
  loadBookings();
}

async function deleteBooking(id) {
  if (!confirm('Delete this booking?')) return;

  if (window.API && typeof window.API.deleteBooking === 'function') {
    await window.API.deleteBooking(id);
  }
  loadBookings();
}

async function clearAllBookings() {
  if (!confirm('WARNING: Are you sure you want to delete ALL bookings?')) return;

  if (window.API && typeof window.API.deleteAllBookings === 'function') {
    await window.API.deleteAllBookings();
  }
  loadBookings();
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

document.addEventListener('DOMContentLoaded', () => {
  checkAdminSession();
});
</script>

</body>
</html>
